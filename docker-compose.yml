version: '3.8'

services:
  database:
    image: postgres:15
    container_name: app_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_database
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: app_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: app_database
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: super_secreto_desarrollo
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      - database
    networks:
      - app_network

volumes:
  pg_data:

networks:
  app_network:
    driver: bridge